<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b63">
  <title>منصة أور لتعلّم الفرنسية</title>
  <style>
    :root{color-scheme:light;--navy:#173b63;--gold:#e8b45b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#102a46,#1e527a);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white;text-align:center;padding:24px}
    main{width:min(420px,100%);padding:34px 24px;border:1px solid #ffffff30;border-radius:28px;background:#ffffff0d;box-shadow:0 20px 60px #0002}
    .mark{width:76px;height:76px;margin:0 auto 20px;border-radius:24px;display:grid;place-items:center;background:var(--gold);color:var(--navy);font-size:36px;font-weight:800}
    h1{font-size:25px;margin:0 0 10px}p{line-height:1.8;color:#e6eef6;margin:0 0 24px}
    a{display:block;background:var(--gold);color:#173b63;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:14px}
    small{display:block;margin-top:18px;color:#cbd8e5}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">أ</div>
    <h1>منصة أور لتعلّم الفرنسية</h1>
    <p>تعلّم الفرنسية من المستوى المبتدئ حتى المتقدم، وتابع دروسك ومفرداتك واختباراتك من هاتفك.</p>
    <a href="https://husseinmishbak.github.io/-/">فتح منصة أور</a>
    <small>العربية · Français · English</small>
  </main>
</body>
</html>
